name: npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch origin --depth=1 "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"
      - run: |
          cp auto.js auto_win.js auto_darwin.js auto_linux.js vips.js AAF_SPEC.md README.md npm/

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$(node -p "require('./npm/package.json').version")"
            test "$GITHUB_REF_NAME" = "v$version"
          fi

          npx --yes npm@11 pack ./npm --dry-run
          npx --yes npm@11 publish ./npm --provenance --access public
